name: CI Fixture

on:
  workflow_dispatch:

jobs:
  network-failure:
    name: Network Failure
    runs-on: ubuntu-latest

    steps:
      - name: Simulate registry network failure
        shell: bash
        run: |
          echo "Starting container image pull"
          echo "Pulling quay.io/example/test-image:latest"
          echo "Error: initializing source docker://quay.io/example/test-image:latest" >&2
          echo "Get \"https://quay.io/v2/\": dial tcp: lookup quay.io: temporary failure in name resolution" >&2
          echo "podman pull failed with exit code 125" >&2
          exit 1
  storage-failure:
    name: Storage Failure
    runs-on: ubuntu-latest

    steps:
      - name: Simulate storage exhaustion
        shell: bash
        run: |
          echo "Starting storage test"
          echo "Writing image layer to /var/lib/containers/storage"
          echo "Error: write /var/lib/containers/storage/overlay/layer: no space left on device" >&2
          echo "podman image pull failed with exit code 125" >&2
          exit 1

  unknown-failure:
    name: Unknown Failure
    runs-on: ubuntu-latest

    steps:
      - name: Simulate an unrecognized failure
        shell: bash
        run: |
          echo "Starting integration test"
          echo "Processing fixture 84f28a"
          echo "Unexpected state transition: ALPHA_7 -> VOID_19" >&2
          echo "Internal operation rejected with code ZX-481" >&2
          exit 1

  successful-job:
    name: Successful Job
    runs-on: ubuntu-latest

    steps:
      - name: Complete successfully
        shell: bash
        run: |
          echo "Starting successful test"
          echo "All checks passed"
          exit 0
